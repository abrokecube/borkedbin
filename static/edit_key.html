<!DOCTYPE html>
<html>

<head>
    <meta name="robots" content="noindex,noarchive,nofollow" />
    <title>BorkedBin - Edit API Key</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .container {
            max-width: 600px;
            margin: auto;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .checkbox-group label {
            display: inline-block;
            margin-right: 1rem;
            margin-bottom: 0.5rem;
            font-weight: normal;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Edit API Key</h1>

        <div class="card">
            <form id="editForm" method="POST">
                <div class="form-group">
                    <label>Key Name</label>
                    <input type="text" id="keyName" name="name" required>
                </div>

                <div class="form-group checkbox-group">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Allowed Types</label>
                    <label><input type="checkbox" id="allowAll" name="allow_all" value="true"> Allow All</label><br>

                    <label><input type="checkbox" name="allowed_types_list" value="text"> Text</label>
                    <label><input type="checkbox" name="allowed_types_list" value="markdown"> Markdown</label>
                    <label><input type="checkbox" name="allowed_types_list" value="url"> URL</label>
                    <label><input type="checkbox" name="allowed_types_list" value="image"> Image</label>
                    <label><input type="checkbox" name="allowed_types_list" value="audio"> Audio</label>
                    <label><input type="checkbox" name="allowed_types_list" value="video"> Video</label>
                    <label><input type="checkbox" name="allowed_types_list" value="file"> File</label>
                </div>

                <div style="margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary" id="saveBtn" disabled>Save Changes</button>
                    <a href="/" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const keyId = window.location.pathname.split('/')[2];
            document.getElementById('editForm').action = `/keys/${keyId}/edit`;

            try {
                const response = await fetch(`/api/admin/keys/${keyId}`);
                if (!response.ok) {
                    alert("Failed to load key data");
                    return;
                }
                const keyData = await response.json();

                document.getElementById('keyName').value = keyData.name;

                const typeCheckboxes = document.querySelectorAll('input[name="allowed_types_list"]');
                const allowAllCheckbox = document.getElementById('allowAll');

                if (keyData.allowed_types === '*') {
                    allowAllCheckbox.checked = true;
                    typeCheckboxes.forEach(cb => cb.checked = true);
                } else {
                    const allowedList = keyData.allowed_types.split(',').map(s => s.trim());
                    typeCheckboxes.forEach(cb => {
                        if (allowedList.includes(cb.value)) {
                            cb.checked = true;
                        }
                    });
                }

                // Enable the save button
                document.getElementById('saveBtn').disabled = false;
            } catch (err) {
                console.error("Error loading key data:", err);
                alert("An error occurred while loading key data.");
            }
        });
    </script>
</body>

</html>
