<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,noarchive,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>BorkedBin - Upload</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div class="top-bar-hover">
        <div class="top-bar">
            <div class="left">
                <a href="/" class="button">BorkedBin</a>
            </div>
            <div class="right">
                <span class="info">upload</span>
            </div>
        </div>
    </div>
    <main class="page-shell">
        <section class="page-section">
            <div class="form-group">
                <label for="apiKey">API key</label>
                <input type="password" id="apiKey" placeholder="Enter your API key to create content">
            </div>
            <div class="form-group">
                <label for="contentTitle">Title <span class="muted">(optional)</span></label>
                <input type="text" id="contentTitle" maxlength="80" placeholder="Give your content a title">
            </div>
            <div class="form-group">
                <label for="expiresIn">Expiry</label>
                <select id="expiresIn">
                    <option value="">Never</option>
                    <option value="60">1 hour</option>
                    <option value="1440">1 day</option>
                    <option value="10080">1 week</option>
                </select>
            </div>
        </section>

        <section class="page-section">
            <div class="tabs" role="group" aria-label="Content type">
                <button type="button" class="tab active" data-target="text-form">[text]</button>
                <button type="button" class="tab" data-target="markdown-form">[markdown]</button>
                <button type="button" class="tab" data-target="url-form">[url]</button>
                <button type="button" class="tab" data-target="file-form">[file]</button>
            </div>

            <form id="text-form" class="tab-content active" onsubmit="submitForm(event, '/api/add/text')">
                <div class="form-group">
                    <label>Plain text content</label>
                    <p class="muted">Max size: <span class="text-size-limit"></span> MB</p>
                    <textarea name="content" required placeholder="Paste your text here..."></textarea>
                </div>
                <button type="submit" class="btn">[create paste]</button>
            </form>

            <form id="markdown-form" class="tab-content" onsubmit="submitForm(event, '/api/add/markdown')">
                <div class="form-group">
                    <label>Markdown content</label>
                    <p class="muted">Max size: <span class="text-size-limit"></span> MB</p>
                    <textarea name="content" required placeholder="# Title&#10;Paste your markdown here..."></textarea>
                </div>
                <button type="submit" class="btn">[create markdown]</button>
            </form>

            <form id="url-form" class="tab-content" onsubmit="submitForm(event, '/api/add/url')">
                <div class="form-group">
                    <label>URL to redirect</label>
                    <input type="text" name="url" required placeholder="https://example.com">
                </div>
                <button type="submit" class="btn">[create shortlink]</button>
            </form>

            <form id="file-form" class="tab-content" onsubmit="submitForm(event, '/api/add/file')">
                <div class="form-group">
                    <label>File</label>
                    <p class="muted">Max size: <span class="file-size-limit"></span> MB</p>
                    <input type="file" name="file" required>
                </div>
                <button type="submit" class="btn">[upload file]</button>
            </form>

            <div id="result" role="status"></div>
        </section>
    </main>
    <script>
        let MAX_FILE_SIZE = 0;
        let MAX_TEXT_SIZE = 0;
        let MAX_FILE_SIZE_MB = 0;
        let MAX_TEXT_SIZE_MB = 0;

        // Fetch upload limits for client-side feedback
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const configRes = await fetch('/api/config');
                const config = await configRes.json();
                MAX_FILE_SIZE_MB = config.max_file_size_mb;
                MAX_TEXT_SIZE_MB = config.max_text_size_mb;
                MAX_FILE_SIZE = MAX_FILE_SIZE_MB * 1024 * 1024;
                MAX_TEXT_SIZE = MAX_TEXT_SIZE_MB * 1024 * 1024;

                document.querySelectorAll('.file-size-limit').forEach(el => el.textContent = MAX_FILE_SIZE_MB);
                document.querySelectorAll('.text-size-limit').forEach(el => el.textContent = MAX_TEXT_SIZE_MB);
            } catch (e) {
                console.error("Failed to fetch upload limits config", e);
            }
        });

        // Tab switching logic
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.add('active');
                document.getElementById('result').style.display = 'none'; // hide result on switch
            });
        });

        async function submitForm(event, endpoint) {
            event.preventDefault();
            const form = event.target;
            const apiKey = document.getElementById('apiKey').value;

            if (!apiKey) {
                showResult('Please enter an API Key', false);
                return;
            }
            document.getElementById('result').style.display = 'none';
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = 'Uploading...';
            submitBtn.disabled = true;

            // Client-side size validation
            const fileInput = form.querySelector('input[type="file"]');
            const textInput = form.querySelector('textarea') || form.querySelector('input[name="url"]');
            var toValidateKey = false;

            if (fileInput && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                if (file.size > MAX_FILE_SIZE) {
                    showResult(`File is too large (${(file.size / 1024 / 1024).toFixed(2)} MB). Maximum allowed size is ${MAX_FILE_SIZE_MB} MB.`, false);
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                    return;
                }
                if (file.size > 1 * 1024 * 1024) {
                    toValidateKey = true; // For files larger than 1MB, also validate permissions client-side
                }
            }

            if (textInput) {
                const textSize = new Blob([textInput.value]).size;
                if (textSize > MAX_TEXT_SIZE) {
                    showResult(`Content is too large (${(textSize / 1024 / 1024).toFixed(2)} MB). Maximum allowed size is ${MAX_TEXT_SIZE_MB} MB.`, false);
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                    return;
                }
                if (textSize > 1 * 1024 * 1024) {
                    toValidateKey = true; // For text larger than 1MB, also validate permissions client-side
                }
            }

            if (toValidateKey) {
                // Client-side permission validation
                try {
                    const permResponse = await fetch('/api/key_permissions', {
                        headers: { 'X-API-Key': apiKey }
                    });
                    if (!permResponse.ok) {
                        showResult('Invalid or inactive API Key', false);
                        submitBtn.innerText = originalBtnText;
                        submitBtn.disabled = false;
                        return;
                    }
                    const permData = await permResponse.json();
                    const allowedTypes = permData.allowed_types;

                    if (!allowedTypes.includes('*')) {
                        let intendedType = '';
                        if (endpoint.includes('/add/text')) intendedType = 'text';
                        else if (endpoint.includes('/add/markdown')) intendedType = 'markdown';
                        else if (endpoint.includes('/add/url')) intendedType = 'url';
                        else if (endpoint.includes('/add/file')) {
                            const file = fileInput ? fileInput.files[0] : null;
                            if (file) {
                                if (file.type.startsWith('image/')) intendedType = 'image';
                                else if (file.type.startsWith('audio/')) intendedType = 'audio';
                                else if (file.type.startsWith('video/')) intendedType = 'video';
                                else if (file.type === 'text/markdown' || file.name.endsWith('.md')) intendedType = 'markdown';
                                else if (file.type.startsWith('text/') || file.type === 'application/json' || file.type === 'application/xml') intendedType = 'text';
                                else intendedType = 'file';
                            }
                        }

                        if (intendedType && !allowedTypes.includes(intendedType)) {
                            showResult(`Your API key does not have permission to upload '${intendedType}' content.`, false);
                            submitBtn.innerText = originalBtnText;
                            submitBtn.disabled = false;
                            return;
                        }
                    }
                } catch (error) {
                    console.error("Failed to verify API key permissions client-side:", error);
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                }
            }


            const formData = new FormData(form);
            const expiresIn = document.getElementById('expiresIn').value;
            const contentTitleElement = document.getElementById('contentTitle');
            const contentTitle = contentTitleElement.value.trim();

            const isFileUpload = endpoint.includes('/add/file');

            try {
                let body;
                const headers = {
                    'X-API-Key': apiKey
                };

                if (isFileUpload) {
                    if (expiresIn) {
                        formData.append('expires_in', expiresIn);
                    }
                    if (contentTitle) {
                        formData.append('title', contentTitle);
                    }
                    body = formData;
                } else {
                    const jsonBody = {};

                    if (endpoint.includes('/add/text') || endpoint.includes('/add/markdown')) {
                        jsonBody.content = formData.get('content');
                    } else if (endpoint.includes('/add/url')) {
                        jsonBody.url = formData.get('url');
                    }

                    if (expiresIn) {
                        jsonBody.expires_in = parseInt(expiresIn);
                    }
                    if (contentTitle) {
                        jsonBody.title = contentTitle;
                    }

                    headers['Content-Type'] = 'application/json';
                    body = JSON.stringify(jsonBody);
                }

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: headers,
                    body: body
                });

                const data = await response.json();

                if (response.ok) {
                    const fullUrl = data.url.startsWith('http') ? data.url : window.location.origin + data.url;
                    showResult(`Success! Created at: <a href="${data.url}" target="_blank">${fullUrl}</a>`, true);
                    contentTitleElement.value = '';
                    form.reset();
                } else {
                    showResult(`Error: ${data.detail || 'Upload failed'}`, false);
                }
            } catch (error) {
                showResult(`Error: ${error.message}`, false);
            } finally {
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
            }
        }

        function showResult(message, isSuccess) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = message;
            resultDiv.className = isSuccess ? 'success' : 'error';
            resultDiv.style.display = 'block';
        }
    </script>
</body>

</html>
