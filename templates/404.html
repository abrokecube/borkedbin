<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | Borkedbin</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            color: #dc3545;
        }

        h2 {
            font-size: 2rem;
            margin-top: 0;
            font-weight: 300;
        }

        p {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 2rem;
        }

        a.btn {
            display: inline-block;
            background: #0d6efd;
            color: white;
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            transition: background 0.2s;
        }

        a.btn:hover {
            background: #0b5ed7;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The content you are looking for has expired, been deleted, or never existed in the first place.</p>
        <a href="/" class="btn">Return to Borkedbin</a>
    </div>
</body>

</html>
