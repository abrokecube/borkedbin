<!DOCTYPE html>
<html>

<head>
    <title>{{ item.title if item.title else item.id }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sometype+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <meta property="og:site_name" content="BorkedBin">
    <meta property="og:title" content="{{ item.title if item.title else item.id }}">
    {% set snippet = content.split('\n',1)[0][:200] %}
    <meta property="og:description" content="Text • {{ '{:,}'.format(content|length) }} chars{% if snippet %} • {{ snippet }}{% endif %}">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:type" content="website">
    
    <style>
        :root {
            --text-zoom: 1;
        }

        body {
            font-family: "Sometype Mono", monospace;
            font-size: 0.9em;
            background: #1a1a1a;
            color: #eee;
            margin-top: 0;
        }

        pre {
            font-family: "Sometype Mono", monospace;
            line-height: 1.4;
            margin: 0;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            font-size: calc(1em * var(--text-zoom));
            scrollbar-width: thin;
            scrollbar-color: #555 #1a1a1a;
            margin-bottom: calc(100vh - 1.5rem - 3rem * var(--text-zoom));
        }

        .wrap-full pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 100%;
        }

        .wrap-comfortable pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 800px;
        }

        .wrap-disabled pre {
            white-space: pre;
            overflow-x: auto;
        }

        .button {
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        .button:hover {
            background-color: #ffffff36;
        }

        .top-bar {
            position: sticky;
            top: 0;
            border-bottom: 1px solid #373737; 
            padding-top: 3px;
            padding-bottom: 3px; 
            display:flex; 
            align-items:center; 
            gap: 8px;
            background-color: inherit;
            user-select: none;

            .info {
                color: #9a9a9a;
                font-size: 0.9em;
            }
        }

    </style>
</head>

<body>
    <div class="top-bar">
        <span class="button" id="wordwrap-toggle">[wrap: full]</span>
        <span class="button" id="zoom-out">[-]</span>
        <span class="button" id="zoom-in">[+]</span>
        <span id="zoom-status" class="info">100%</span>
        <span style="flex-grow: 1;"></span>
        <span id="text-length" class="info">{{ '{:,}'.format(content|length) }} chars</span>
    </div>
    <div style="display: flex; flex-direction: row; justify-content: center;">
        <pre id="text-content">{{ content }}</pre>
    </div>

    <script>
        (function(){
            const button = document.getElementById('wordwrap-toggle');
            const zoomInEl = document.getElementById('zoom-in');
            const zoomOutEl = document.getElementById('zoom-out');
            const zoomStatus = document.getElementById('zoom-status');
            const root = document.documentElement;

            const ZOOM_KEY = 'textZoom';
            const ZOOM_STEP = 0.1;
            const ZOOM_MIN = 0.5;
            const ZOOM_MAX = 3.0;

            function setZoom(z){
                const clamped = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
                root.style.setProperty('--text-zoom', String(clamped));
                if(zoomStatus) zoomStatus.textContent = Math.round(clamped*100) + '%';
                try{ localStorage.setItem(ZOOM_KEY, String(clamped)); }catch(e){}
            }

            function applyState(mode){
                root.classList.remove('wrap-full', 'wrap-comfortable', 'wrap-disabled');
                if(mode === 'full'){
                    root.classList.add('wrap-full');
                    button.innerText = '[wrap: full]';
                }else if(mode === 'comfortable'){
                    root.classList.add('wrap-comfortable');
                    button.innerText = '[wrap:comfy]';
                }else{
                    root.classList.add('wrap-disabled');
                    button.innerText = '[wrap: off ]';
                }
                button.setAttribute('aria-pressed', mode !== 'off' ? 'true' : 'false');
            }

            function getNextMode(current){
                if(current === 'full') return 'comfortable';
                if(current === 'comfortable') return 'off';
                return 'full';
            }

            const MODES = ['full', 'comfortable', 'off'];

            // Read stored preferences
            try {
                const storedWrap = localStorage.getItem('wordWrap');
                let mode = storedWrap ? storedWrap : 'full';
                if(!MODES.includes(mode)) mode = 'full';
                applyState(mode);
            } catch (e) {
                applyState('full');
            }

            // Zoom: read stored zoom or default to 1
            try{
                const storedZoom = parseFloat(localStorage.getItem(ZOOM_KEY));
                setZoom(isNaN(storedZoom) ? 1 : storedZoom);
            }catch(e){ setZoom(1); }

            button.addEventListener('click', function(){
                let currentMode = 'full';
                if(root.classList.contains('wrap-comfortable')) currentMode = 'comfortable';
                else if(root.classList.contains('wrap-disabled')) currentMode = 'off';
                const newMode = getNextMode(currentMode);
                applyState(newMode);
                try { localStorage.setItem('wordWrap', newMode); } catch(e){}
            });

            if(zoomInEl){
                zoomInEl.addEventListener('click', function(){
                    const current = parseFloat(getComputedStyle(root).getPropertyValue('--text-zoom')) || 1;
                    setZoom(current + ZOOM_STEP);
                });
            }
            if(zoomOutEl){
                zoomOutEl.addEventListener('click', function(){
                    const current = parseFloat(getComputedStyle(root).getPropertyValue('--text-zoom')) || 1;
                    setZoom(current - ZOOM_STEP);
                });
            }
        })();
    </script>
</body>

</html>
