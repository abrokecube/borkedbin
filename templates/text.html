<!DOCTYPE html>
<html>

<head>
    <title>{{ item.title if item.title else item.id }}</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sometype+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#1a1a1a">
    <meta property="og:site_name" content="BorkedBin">
    <meta property="og:title" content="{{ item.title if item.title else item.id }}">
    {% set snippet = content.split('\n',1)[0] %}
    {% if snippet|length > 200 %}{% set snippet = snippet[:199] + '…' %}{% endif %}
    <meta property="og:description" content="Text • {{ content_size|format_size }}{% if snippet %} • {{ snippet }}{% endif %}">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:type" content="website">
    
    <style>
        :root {
            --text-zoom: 1;
            --bg-col-dark: #1a1a1a;
            --text-col-dark: #eee;
        }

        body {
            font-family: "Sometype Mono", monospace;
            font-size: 0.9em;
            background: var(--bg-col-dark);
            color: var(--text-col-dark);
            margin: 0;
        }

        pre {
            font-family: "Sometype Mono", monospace;
            line-height: 1.4;
            margin: 0;
            font-size: calc(1em * var(--text-zoom));
            scrollbar-width: thin;
            scrollbar-color: #555 var(--bg-col-dark);
            padding-top: 6px;
            padding-bottom: calc(0.5rem + 100vh - 1.5rem - 3rem * var(--text-zoom));
            padding-left: 6px;
            padding-right: 6px;
        }

        .wrap-full pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 100%;
        }

        .wrap-comfortable pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 800px;
        }

        .wrap-disabled pre {
            white-space: pre;
            overflow-x: auto;

            &.page-wide {
                padding-right: calc(6px + 10rem);
            }
        }

        .button {
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        a.button {
            color: inherit;
            text-decoration: none;
        }

        .button:hover {
            background-color: #ffffff36;
        }

        .top-bar.hidden {
            transform: translateY(-100%);
        }

        .top-bar {
            position: relative;
            width: calc(100% - 12px);
            top: 0;
            border-bottom: 1px solid #373737; 
            padding-top: 2px;
            padding-bottom: 4px; 
            padding-left: 6px;
            padding-right: 6px;
            display: flex; 
            align-items: center; 
            background-color: inherit;
            user-select: none;
            white-space: nowrap;
            flex-wrap: wrap;
            transition: transform 0.2s ease;
            z-index: 100;
            background-color: var(--bg-col-dark);

            .info {
                color: #9a9a9a;
                font-size: 0.9em;
            }
            .left {
                display: flex;
                align-items: baseline;
                gap: 6px;
                flex-wrap: wrap;
            }
            .right {
                display: flex;
                flex-grow: 1;
                align-items: baseline;
                gap: 6px;
                margin-left: 8px;
                justify-content: flex-end;
                flex-wrap: wrap;
            }
        }

        .top-bar-hover {
            position: sticky;
            display: flex;
            top: 0;
            left: 0;
            right: 0;
            z-index: 99;
        }
        .hover-extra {
            position: absolute;
            height: 100px;
            left: 0;
            right: 0;
        }

        @media (hover: hover) {
            .top-bar-hover:hover .top-bar {
                transform: translateY(0);
            }
        }

        @media (hover: none) {
            .top-bar.hidden {
                transform: translateY(-100%);
            }
        }

    </style>
</head>

<body>
    <div class="top-bar-hover">
        <div class="top-bar">
            <div class="left">
                <span class="button" id="wordwrap-toggle">[wrap: full]</span>
                <span class="button" id="zoom-out">[-]</span>
                <span class="button" id="zoom-in">[+]</span>
                <span id="zoom-status" class="info">100%</span>
            </div>
            <div class="right">
                <span id="text-length" class="info">{{ content_size|format_size }}</span>
                <a href="./raw/{{ item.id }}" class="button">[raw]</a>
            </div>
        </div>
        <div class="hover-extra">

        </div>
    </div>
    <div style="display: flex; flex-direction: row; justify-content: center;">
        <pre id="text-content">{{ content }}</pre>
    </div>

    <script>
        (function(){
            const button = document.getElementById('wordwrap-toggle');
            const zoomInEl = document.getElementById('zoom-in');
            const zoomOutEl = document.getElementById('zoom-out');
            const zoomStatus = document.getElementById('zoom-status');
            const root = document.documentElement;
            const pre = document.getElementById('text-content');

            function checkWidth(){
                if(pre.scrollWidth > window.innerWidth){
                    pre.classList.add('page-wide');
                }else{
                    pre.classList.remove('page-wide');
                }
            }

            const ZOOM_KEY = 'textZoom';
            const ZOOM_STEP = 0.1;
            const ZOOM_MIN = 0.5;
            const ZOOM_MAX = 3.0;

            function setZoom(z){
                const clamped = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
                root.style.setProperty('--text-zoom', String(clamped));
                if(zoomStatus) zoomStatus.textContent = Math.round(clamped*100) + '%';
                try{ localStorage.setItem(ZOOM_KEY, String(clamped)); }catch(e){}
            }

            function applyState(mode){
                root.classList.remove('wrap-full', 'wrap-comfortable', 'wrap-disabled');
                if(mode === 'full'){
                    root.classList.add('wrap-full');
                    button.innerText = '[wrap: full]';
                }else if(mode === 'comfortable'){
                    root.classList.add('wrap-comfortable');
                    button.innerText = '[wrap:comfy]';
                }else{
                    root.classList.add('wrap-disabled');
                    button.innerText = '[wrap: off ]';
                }
                button.setAttribute('aria-pressed', mode !== 'off' ? 'true' : 'false');
            }

            function getNextMode(current){
                if(current === 'full') return 'comfortable';
                if(current === 'comfortable') return 'off';
                return 'full';
            }

            const MODES = ['full', 'comfortable', 'off'];

            // Read stored preferences
            try {
                const storedWrap = localStorage.getItem('wordWrap');
                let mode = storedWrap ? storedWrap : 'full';
                if(!MODES.includes(mode)) mode = 'full';
                applyState(mode);
            } catch (e) {
                applyState('full');
            }

            // Zoom: read stored zoom or default to 1
            try{
                const storedZoom = parseFloat(localStorage.getItem(ZOOM_KEY));
                setZoom(isNaN(storedZoom) ? 1 : storedZoom);
            }catch(e){ setZoom(1); }

            button.addEventListener('click', function(){
                let currentMode = 'full';
                if(root.classList.contains('wrap-comfortable')) currentMode = 'comfortable';
                else if(root.classList.contains('wrap-disabled')) currentMode = 'off';
                const newMode = getNextMode(currentMode);
                applyState(newMode);
                try { localStorage.setItem('wordWrap', newMode); } catch(e){}
                checkWidth();
            });

            if(zoomInEl){
                zoomInEl.addEventListener('click', function(){
                    const current = parseFloat(getComputedStyle(root).getPropertyValue('--text-zoom')) || 1;
                    setZoom(current + ZOOM_STEP);
                });
            }
            if(zoomOutEl){
                zoomOutEl.addEventListener('click', function(){
                    const current = parseFloat(getComputedStyle(root).getPropertyValue('--text-zoom')) || 1;
                    setZoom(current - ZOOM_STEP);
                });
            }

            // Hide/show top bar on scroll
            (function(){
                const topBar = document.querySelector('.top-bar');
                let lastScrollTop = 0;
                const SCROLL_THRESHOLD = 10;

                window.addEventListener('scroll', function(){
                    const scrollTop = window.scrollY || document.documentElement.scrollTop;
                    const diff = scrollTop - lastScrollTop;

                    if(Math.abs(diff) >= SCROLL_THRESHOLD){
                        if(diff > 0){
                            topBar.classList.add('hidden');
                        }else{
                            topBar.classList.remove('hidden');
                        }
                        lastScrollTop = scrollTop;
                    }
                }, { passive: true });
            })();

            // Add page-wide class when pre overflows
            checkWidth();
            window.addEventListener('resize', checkWidth);
        })();
    </script>
</body>

</html>
