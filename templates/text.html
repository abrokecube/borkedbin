<!DOCTYPE html>
<html>

<head>
    <meta name="robots" content="noindex,noarchive,nofollow" />
    <title>{{ item.title if item.title else item.id }}</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/theme.css">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#1a1a1a">
    <meta property="og:site_name" content="BorkedBin">
    <meta property="og:title" content="{{ item.title if item.title else item.id }}">
    {% set snippet = content.split('\n',1)[0] %}
    {% if snippet|length > 200 %}{% set snippet = snippet[:199] + '…' %}{% endif %}
    <meta property="og:description"
        content="Text • {{ content_size|format_size }}{% if snippet %} • {{ snippet }}{% endif %}">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:type" content="website">
    <style>
        body {
            display: flex;
            flex-direction: column;
        }

        #text-content {
            position: relative;
            width: fit-content;
            margin: auto;
            padding: 6px;
            padding-top: calc(6px + 6px + 1rem);
            font-family: inherit;
            font-size: calc(1em * var(--text-zoom));
            line-height: 1.4;
        }

        #text-container {
            flex-grow: 1;
            padding: 0;
            margin: 0;
            gap: 0;
            align-items: flex-start;
            scrollbar-width: thin;
            scrollbar-color: var(--muted) transparent;
        }

        #text-container-inner {
            width: max-content;
            min-width: 100%;
        }

        #text-container.wrap-full {
            max-width: 100%;
        }

        #text-container.wrap-full #text-container-inner {
            max-width: 100%;
        }

        #text-container.wrap-full #text-content {
            max-width: 100%;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #text-container.wrap-comfortable #text-content {
            max-width: 800px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #text-container.wrap-off.page-wide #text-content {
            margin-right: calc(6px + 50vw);
            border-right: 1px solid var(--line);
        }

        #text-container hr {
            width: max-content;
            min-width: 100%;
            margin: 0;
            border: 0;
            border-bottom: 1px solid var(--line);
        }

        #bottom-pad {
            margin-bottom: 75vh;
        }

        .button {
            white-space-collapse: preserve;
        }
    </style>
</head>

<body>
    <div class="top-bar-hover">
        <div class="top-bar">
            <div class="left">
                <span class="button" id="wordwrap-toggle">[wrap: full]</span>
                <span class="button" id="zoom-out">[-]</span>
                <span class="button" id="zoom-in">[+]</span>
                <span id="zoom-status" class="info">100%</span>
            </div>
            <div class="right">
                <span id="text-length" class="info" style="user-select: text;">{{ content_size|format_size }}</span>
                <a href="/raw/{{ item.id }}" class="button">[raw]</a>
            </div>
        </div>
    </div>
    <div id="text-container" class="wrap-off">
        <div id="text-container-inner">
            <pre id="text-content">{{ content }}</pre>
            <hr>
            <div id="bottom-pad"></div>
        </div>
    </div>

    <script>
        (function () {

            function throttleTrailing(fn, limit) {
                let lastCall = 0;
                let timeoutId = null;
                let lastArgs = null;
                let lastThis = null;

                return function (...args) {
                    const now = performance.now();
                    lastArgs = args;
                    lastThis = this;

                    if (!timeoutId) {
                        if (now - lastCall >= limit) {
                            // If enough time has passed, execute immediately
                            execute();
                        } else {
                            // Otherwise, set a timeout to execute later
                            timeoutId = setTimeout(execute, limit - (now - lastCall));
                        }
                    }
                };

                function execute() {
                    lastCall = performance.now();
                    timeoutId = null;
                    if (lastArgs !== null) {
                        fn.apply(lastThis, lastArgs);
                        lastArgs = null;
                        lastThis = null;
                    }
                }
            }

            const WrapMode = Object.freeze({
                FULL: 'full',
                COMFORTABLE: 'comfortable',
                OFF: 'off'
            });
            const WrapOrder = [WrapMode.COMFORTABLE, WrapMode.FULL, WrapMode.OFF];
            const WrapButtonText = {
                [WrapMode.FULL]: '[wrap: full]',
                [WrapMode.COMFORTABLE]: '[wrap:comfy]',
                [WrapMode.OFF]: '[wrap: off ]'
            };
            var currentWrapMode = WrapMode.COMFORTABLE;

            const button = document.getElementById('wordwrap-toggle');
            const root = document.documentElement;
            const pre = document.getElementById('text-content');
            const container = document.getElementById('text-container');

            function checkWidth() {
                if (pre.scrollWidth > window.innerWidth) {
                    container.classList.add('page-wide');
                } else {
                    container.classList.remove('page-wide');
                }
            }

            function cycleWrapMode() {
                const currentIndex = WrapOrder.indexOf(currentWrapMode);
                const nextIndex = (currentIndex + 1) % WrapOrder.length;
                currentWrapMode = WrapOrder[nextIndex];
                setWrapMode(currentWrapMode);
            }

            const COMFORTABLE_MAX_WIDTH = 875;
            function setWrapMode(wrapMode) {
                if (wrapMode == WrapMode.COMFORTABLE && window.screen.width < COMFORTABLE_MAX_WIDTH) {
                    cycleWrapMode();
                    return;
                }
                if (window.screen.width < COMFORTABLE_MAX_WIDTH) {
                    WrapButtonText[WrapMode.FULL] = '[wrap:on ]'
                    WrapButtonText[WrapMode.OFF] = '[wrap:off]'
                } else {
                    WrapButtonText[WrapMode.FULL] = '[wrap: full]'
                    WrapButtonText[WrapMode.OFF] = '[wrap: off ]'
                }
                currentWrapMode = wrapMode;
                WrapOrder.forEach(mode => container.classList.remove('wrap-' + mode));
                container.classList.add('wrap-' + wrapMode);
                button.innerText = WrapButtonText[wrapMode];
                try { localStorage.setItem('wordWrap', wrapMode); } catch (e) { }
            }

            try {
                const storedWrap = localStorage.getItem('wordWrap');
                let mode = storedWrap ? storedWrap : WrapMode.COMFORTABLE;
                if (!WrapOrder.includes(mode)) mode = WrapMode.COMFORTABLE;
                setWrapMode(mode);
            } catch (e) {
                setWrapMode(WrapMode.COMFORTABLE);
            }

            button.addEventListener('click', function () {
                cycleWrapMode();
                checkWidth();
            });

            window.addEventListener('resize', () => {
                setWrapMode(currentWrapMode);
                checkWidth();
            });

            const zoomInEl = document.getElementById('zoom-in');
            const zoomOutEl = document.getElementById('zoom-out');
            const zoomStatus = document.getElementById('zoom-status');

            const ZOOM_KEY = 'textZoom';
            const ZOOM_STEP = 0.1;
            const ZOOM_MIN = 0.5;
            const ZOOM_MAX = 3.0;

            function setZoom(z) {
                const clamped = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
                root.style.setProperty('--text-zoom', String(clamped));
                if (zoomStatus) zoomStatus.textContent = Math.round(clamped * 100) + '%';
                try { localStorage.setItem(ZOOM_KEY, String(clamped)); } catch (e) { }
                checkWidth();
            }

            // Zoom: read stored zoom or default to 1
            try {
                const storedZoom = parseFloat(localStorage.getItem(ZOOM_KEY));
                setZoom(isNaN(storedZoom) ? 1 : storedZoom);
            } catch (e) { setZoom(1); }


            if (zoomInEl) {
                zoomInEl.addEventListener('click', function () {
                    const current = parseFloat(getComputedStyle(root).getPropertyValue('--text-zoom')) || 1;
                    setZoom(current + ZOOM_STEP);
                });
            }
            if (zoomOutEl) {
                zoomOutEl.addEventListener('click', function () {
                    const current = parseFloat(getComputedStyle(root).getPropertyValue('--text-zoom')) || 1;
                    setZoom(current - ZOOM_STEP);
                });
            }

            // Hide/show top bar on scroll
            (function () {
                const topBar = document.querySelector('.top-bar');
                let lastScrollTop = 0;
                const SCROLL_THRESHOLD = 10;

                document.addEventListener('scroll', throttleTrailing(() => {
                    const scrollTop = window.scrollY || document.documentElement.scrollTop;
                    const diff = scrollTop - lastScrollTop;

                    if (Math.abs(diff) >= SCROLL_THRESHOLD) {
                        if (diff > 0) {
                            topBar.classList.add('hidden');
                        } else {
                            topBar.classList.remove('hidden');
                        }
                        lastScrollTop = scrollTop;
                    }
                }, 100), { passive: true });
            })();

            // Show top bar when hovering near top of screen
            (function () {
                const topBarHover = document.querySelector('.top-bar-hover');
                const THRESHOLD = 100;

                document.addEventListener('mousemove', throttleTrailing((e) => {
                    if (e.clientY <= THRESHOLD) {
                        topBarHover.classList.add('extra-hovered');
                    } else {
                        topBarHover.classList.remove('extra-hovered');
                    }
                }, 100));
            })();

            document.addEventListener('DOMContentLoaded', () => {
                checkWidth();
                setTimeout(() => {
                    checkWidth();
                }, 500);
            });
        })();
    </script>
</body>

</html>
