<!DOCTYPE html>
<html>

<head>
    <title>{{ item.title if item.title else "BorkedBin - Video" }}</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        video {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <video controls preload="metadata">
        <source src="/raw/{{ item.id }}"
            type="{{ metadata.get('magic_mime', metadata.get('content_type', 'video/mp4')) }}">
        Your browser does not support the video element.
    </video>
</body>

</html>
