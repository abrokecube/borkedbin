<!DOCTYPE html>
<html>

<head>
    <title>{{ item.title if item.title else "Borkedbin - Image" }}</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <img src="/raw/{{ item.id }}" alt="Image" />
</body>

</html>
