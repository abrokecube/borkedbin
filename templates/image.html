<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,noarchive,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>{{ item.title if item.title else metadata.get("filename", item.id) }}</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/styles.css">
</head>

<body class="media-page">
    <div class="top-bar-hover">
        <div class="top-bar">
            <div class="left item-title-wrap">
                <span class="item-title"
                    title="{{ item.title if item.title else metadata.get('filename', item.id) }}">
                    {{ item.title if item.title else metadata.get("filename", item.id) }}
                </span>
            </div>
            <div class="right">
                {% if metadata.get("size") %}
                <span class="info">{{ metadata.get("size")|format_size }}</span>
                {% endif %}
                <a href="/raw/{{ item.id }}" class="button">[raw]</a>
            </div>
        </div>
    </div>
    <main class="media-stage">
        <img src="/raw/{{ item.id }}" alt="{{ item.title if item.title else metadata.get('filename', 'Image') }}">
    </main>
</body>

</html>
