<!DOCTYPE html>
<html>

<head>
    <title>{{ item.title if item.title else "Borkedbin - Audio" }}</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #16213e;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            color: #e2e2e2;
        }

        audio {
            width: 100%;
            margin: 1rem 0;
        }

        .info {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-block;
            background: #0f3460;
            color: white;
            padding: 0.6rem 1.2rem;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #1a4a8a;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>{{ item.title if item.title else "Audio Player" }}</h1>
        <audio controls preload="metadata">
            <source src="/raw/{{ item.id }}"
                type="{{ metadata.get('magic_mime', metadata.get('content_type', 'audio/mpeg')) }}">
            Your browser does not support the audio element.
        </audio>
        <div class="info">
            <strong>Filename:</strong> {{ metadata.get("filename", item.id) }}<br>
            <strong>Size:</strong> {{ '{:.2f}'.format(metadata.get("size", 0) / 1024) }} KB
        </div>
        <a href="/download/{{ item.id }}" class="btn">Download</a>
    </div>
</body>

</html>
