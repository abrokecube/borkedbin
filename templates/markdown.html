<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,noarchive,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>{{ item.title if item.title else item.id }}</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div class="top-bar-hover">
        <div class="top-bar">
            <div class="left item-title-wrap">
                <span class="item-title" title="{{ item.title if item.title else item.id }}">
                    {{ item.title if item.title else item.id }}
                </span>
            </div>
            <div class="right">
                <span class="info">{{ content_size|format_size }}</span>
                <a href="/raw/{{ item.id }}" class="button">[raw]</a>
            </div>
        </div>
    </div>
    <main class="markdown-content">
        {{ html_content | safe }}
    </main>
</body>

</html>
